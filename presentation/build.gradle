apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'com.google.dagger.hilt.android'

def versions = rootProject.ext

android {
    namespace 'com.example.sbtechnicaltest.presentation'
    compileSdkVersion rootProject.ext.compile_sdk_version

    defaultConfig {
        minSdkVersion rootProject.ext.min_sdk_version
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose = true
    }
}

dependencies {
    implementation project(':domain')

    implementation platform("androidx.compose:compose-bom:${versions.compose_bom_version}")
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.compose.material3:material3'
    implementation "androidx.lifecycle:lifecycle-runtime-compose:${versions.lifecycle_version}"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:${versions.lifecycle_version}"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:${versions.lifecycle_version}"
    implementation 'androidx.hilt:hilt-lifecycle-viewmodel-compose:1.3.0'
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:${versions.coroutines_version}"
    implementation "com.google.dagger:hilt-android:${versions.hilt_version}"
    kapt "com.google.dagger:hilt-compiler:${versions.hilt_version}"
    implementation "io.coil-kt.coil3:coil-compose:${versions.coil_version}"

    testImplementation 'junit:junit:4.13.2'
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:${versions.coroutines_version}"
    testImplementation "io.mockk:mockk:${versions.mockk_version}"
}

kapt {
    correctErrorTypes = true
}
