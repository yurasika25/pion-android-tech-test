apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'
apply plugin: 'com.google.dagger.hilt.android'

def versions = rootProject.ext
def baseUrl = providers.gradleProperty("DUMMY_JSON_BASE_URL").get()

android {
    namespace 'com.example.sbtechnicaltest.data'
    compileSdkVersion rootProject.ext.compile_sdk_version

    defaultConfig {
        minSdkVersion rootProject.ext.min_sdk_version
        buildConfigField "String", "BASE_URL", "\"${baseUrl}\""
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        buildConfig = true
    }
}

dependencies {
    implementation project(':domain')

    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:${versions.coroutines_version}"
    implementation "com.google.dagger:hilt-android:${versions.hilt_version}"
    kapt "com.google.dagger:hilt-compiler:${versions.hilt_version}"
    implementation "com.squareup.retrofit2:retrofit:${versions.retrofit_version}"
    implementation "com.squareup.retrofit2:converter-gson:${versions.retrofit_version}"
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:${versions.coroutines_version}"
    testImplementation "io.mockk:mockk:${versions.mockk_version}"
}

kapt {
    correctErrorTypes = true
}
